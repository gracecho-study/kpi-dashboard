<!doctype html>
<!-- build: auto-deploy 2026-07-04b (library search) -->
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>📄 문서함 · KPI 비서</title>
<style>
  :root{--bg:#0b0f17;--panel:#111726;--panel2:#0e1420;--line:#1e293b;--txt:#e2e8f0;--muted:#94a3b8;--accent:#38bdf8;--bad:#f87171}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:"Pretendard","Apple SD Gothic Neo",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  header{position:sticky;top:0;background:rgba(11,15,23,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:14px 16px;z-index:5}
  .top-row{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:10px}
  h1{font-size:18px;margin:0;flex:1}
  .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .icon{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
  .icon:hover{border-color:var(--accent)}
  .ctrls{max-width:900px;margin:12px auto 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .search{flex:1;min-width:180px;position:relative}
  .search input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:9px 12px 9px 32px;font:inherit;font-size:13px}
  .search:before{content:"🔎";position:absolute;left:10px;top:8px;font-size:13px;opacity:.7}
  .sortbtn{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:9px 12px;font-size:12.5px;cursor:pointer;white-space:nowrap}
  .chips{max-width:900px;margin:10px auto 0;display:flex;gap:6px;flex-wrap:wrap}
  .chip{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer}
  .chip.on{background:var(--accent);color:#04222e;border-color:var(--accent)}
  main{max-width:900px;margin:0 auto;padding:16px}
  .doc-row{display:flex;align-items:center;gap:10px;padding:12px 12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:9px}
  .doc-ic{font-size:18px;flex:0 0 auto}
  .doc-nm{flex:1;font-size:14px;min-width:0;word-break:break-all;line-height:1.45}
  .doc-cat{font-size:10.5px;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:8px;white-space:nowrap}
  .doc-act{display:flex;gap:6px;flex:0 0 auto}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:7px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
  .btn.p{border-color:var(--accent);color:var(--accent)}
  .btn:hover{border-color:var(--accent)}
  .empty,.center{color:var(--muted);text-align:center;padding:44px 16px;line-height:1.6}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;max-width:90vw}
  .toast.show{opacity:1}
</style></head>
<body>
<header>
  <div class="top-row">
    <div style="flex:1"><h1>📄 문서함</h1><div class="sub" id="sub">분석·전략 산출물</div></div>
    <a class="icon" href="index.html">← 대시보드</a>
    <button class="icon" id="refresh" title="새로고침">↻</button>
  </div>
  <div class="ctrls">
    <div class="search"><input id="q" type="search" placeholder="파일명 검색…" autocomplete="off"></div>
    <button class="sortbtn" id="sort">↕ 이름순</button>
  </div>
  <div class="chips" id="chips"></div>
</header>
<main id="main"><div class="center"><span class="spin"></span><div>불러오는 중…</div></div></main>
<div class="toast" id="toast"></div>
<script>
"use strict";
const LS_KEY="kpi-dash-cfg";
const DEFAULTS={token:"",owner:"gracecho-study",repo:"2020-study",branch:"claude/dreamy-bell-nwgcly"};
const DOCS_DIR="assistant/docs";
function getCfg(){try{return Object.assign({},DEFAULTS,JSON.parse(localStorage.getItem(LS_KEY)||"{}"));}catch(e){return Object.assign({},DEFAULTS);}}
const $=s=>document.querySelector(s);
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2600);}
function b64DecodeUtf8(b64){const bin=atob((b64||"").replace(/\s/g,""));const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return new TextDecoder("utf-8").decode(b);}
async function gh(path){
  const c=getCfg();
  if(!c.token){const e=new Error("토큰 없음");e.code="NOTOKEN";throw e;}
  const res=await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/${path}`,{headers:{
    "Authorization":`Bearer ${c.token}`,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}});
  if(!res.ok){let b="";try{b=(await res.json()).message||"";}catch(_){} const e=new Error(`GitHub ${res.status} ${b}`);e.status=res.status;throw e;}
  return res.json();
}
async function listDir(dir){const c=getCfg();try{const d=await gh(`contents/${encodeURI(dir)}?ref=${encodeURIComponent(c.branch)}`);return Array.isArray(d)?d:[];}catch(e){if(e.status===404)return[];throw e;}}
async function getFile(p){const c=getCfg();const d=await gh(`contents/${encodeURI(p)}?ref=${encodeURIComponent(c.branch)}`);return b64DecodeUtf8(d.content);}
function parseName(name){
  const dot=name.lastIndexOf(".");
  const ext=dot>=0?name.slice(dot):"";
  const base=dot>=0?name.slice(0,dot):name;
  const m=base.match(/^(.*?)[ _]*[vV](\d+)$/);
  return {stem:m?m[1].replace(/[ _]+$/,""):base, ext, ver:m?parseInt(m[2],10):0};
}
function latestOnly(files){
  const map=new Map();
  files.forEach(f=>{const {stem,ext,ver}=parseName(f.name);const key=stem+"|"+ext;const cur=map.get(key);if(!cur||ver>cur._ver)map.set(key,Object.assign({},f,{_ver:ver}));});
  return [...map.values()];
}
// 폴더 없이 주제로 묶기(파일명 키워드 기반)
function category(name){
  if(/레쥬메|커리어|resume/i.test(name)) return "커리어";
  if(/논페이드/.test(name)) return "논페이드";
  if(/체험/.test(name)) return "체험";
  if(/미니|보장성|페르소나|재유입|부검|진단|타깃|POC|목업/.test(name)) return "미니→보장성";
  return "기타";
}
async function openDoc(path,name){
  try{const text=await getFile(path);const blob=new Blob([text],{type:/\.html?$/i.test(name)?"text/html;charset=utf-8":"text/plain;charset=utf-8"});
    const url=URL.createObjectURL(blob);window.open(url,"_blank");setTimeout(()=>URL.revokeObjectURL(url),60000);
  }catch(e){toast("열기 실패: "+(e.message||e));}
}
async function downloadDoc(path,name){
  try{const text=await getFile(path);const blob=new Blob([text],{type:"application/octet-stream"});
    const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
  }catch(e){toast("다운로드 실패: "+(e.message||e));}
}
let ALL=[], CAT="전체", SORT="name"; // name | recent
function draw(){
  const q=($("#q").value||"").trim().toLowerCase();
  let list=ALL.filter(f=>(CAT==="전체"||f._cat===CAT) && (!q||f.name.toLowerCase().includes(q)));
  list.sort((a,b)=> SORT==="name" ? a.name.localeCompare(b.name,"ko") : b.name.localeCompare(a.name,"ko"));
  $("#sub").textContent=`${list.length}개${q||CAT!=="전체"?" (필터됨)":""} · 최신 버전만`;
  if(!list.length){$("#main").innerHTML=`<div class="empty">조건에 맞는 문서가 없어요.</div>`;return;}
  $("#main").innerHTML=list.map(f=>{
    const html=/\.html?$/i.test(f.name);
    const p=encodeURIComponent(f.path), n=encodeURIComponent(f.name);
    return `<div class="doc-row"><span class="doc-ic">${html?"🌐":"📄"}</span>
      <span class="doc-nm">${esc(f.name)}<span class="doc-cat">${esc(f._cat)}</span></span>
      <span class="doc-act">${html?`<button class="btn p" data-open="${p}" data-name="${n}">열기</button>`:""}<button class="btn" data-dl="${p}" data-name="${n}">⬇ 저장</button></span></div>`;
  }).join("");
  document.querySelectorAll("[data-open]").forEach(el=>el.onclick=()=>openDoc(decodeURIComponent(el.dataset.open),decodeURIComponent(el.dataset.name)));
  document.querySelectorAll("[data-dl]").forEach(el=>el.onclick=()=>downloadDoc(decodeURIComponent(el.dataset.dl),decodeURIComponent(el.dataset.name)));
}
function buildChips(){
  const cats=["전체",...[...new Set(ALL.map(f=>f._cat))].sort((a,b)=>a==="기타"?1:b==="기타"?-1:a.localeCompare(b,"ko"))];
  $("#chips").innerHTML=cats.map(c=>`<span class="chip${c===CAT?" on":""}" data-cat="${esc(c)}">${esc(c)}</span>`).join("");
  document.querySelectorAll("#chips .chip").forEach(el=>el.onclick=()=>{CAT=el.dataset.cat;buildChips();draw();});
}
async function load(){
  const c=getCfg();
  if(!c.token){$("#main").innerHTML=`<div class="empty">GitHub 토큰이 없어요.<br>대시보드 ⚙ 설정에서 토큰을 넣으면 문서가 보여요.<br><br><a class="btn p" href="index.html">← 대시보드로</a></div>`;return;}
  $("#main").innerHTML=`<div class="center"><span class="spin"></span><div>불러오는 중…</div></div>`;
  try{
    let files=(await listDir(DOCS_DIR)).filter(f=>f.type==="file" && !/^\./.test(f.name));
    ALL=latestOnly(files).map(f=>Object.assign(f,{_cat:category(f.name)}));
    if(!ALL.length){$("#main").innerHTML=`<div class="empty">아직 문서가 없어요.</div>`;return;}
    buildChips(); draw();
  }catch(e){
    $("#main").innerHTML=`<div class="empty">불러오기 실패: ${esc(e.message||e)}<br><br><a class="btn" href="index.html">← 대시보드</a></div>`;
  }
}
$("#q").addEventListener("input",draw);
$("#sort").onclick=()=>{ SORT=SORT==="name"?"recent":"name"; $("#sort").textContent=SORT==="name"?"↕ 이름순":"↕ 최신순"; draw(); };
$("#refresh").onclick=load;
load();
</script>
</body></html>
